# The /classes/ part of the VPS's nginx server block for passaly.com (copied
# from ~/nginx/conf.d/default.conf). Goes inside the existing `server { }`;
# the `api` limit_req zone and security_headers.inc are defined there already.

    # Hackathon class server (~/class_tutor, container "classes"). Own headers:
    # live captions need the microphone, which the shared set turns off.
    location = /classes { return 301 /classes/; }
    location /classes/models/ {
        alias /var/www/certbot/classes-models/;
        autoindex off;
        gzip off;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security_headers.inc;
        types {
            application/json         json;
            text/plain               txt;
            application/octet-stream litertlm;
        }
    }
    location /classes/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;
        # Resolved per request, so nginx (and passaly.com) still starts when
        # this container is down or removed.
        resolver 127.0.0.11 valid=30s;
        set $classes http://classes:8010;
        rewrite ^/classes/(.*)$ /$1 break;
        proxy_pass $classes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }
