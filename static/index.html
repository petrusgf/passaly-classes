<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EC662E">
<title>Passaly Classes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  :root { --bs-primary: #EC662E; --bs-primary-rgb: 236,102,46; --bs-link-color: #c84f1c; }
  .btn-primary { --bs-btn-bg:#EC662E; --bs-btn-border-color:#EC662E; --bs-btn-hover-bg:#d4561f;
                 --bs-btn-hover-border-color:#d4561f; --bs-btn-active-bg:#bf4c1b; }
  .btn-outline-primary { --bs-btn-color:#c84f1c; --bs-btn-border-color:#EC662E;
                         --bs-btn-hover-bg:#EC662E; --bs-btn-hover-border-color:#EC662E; }
  body { background: #f7f7f8; }
  .brand { color: #EC662E; font-weight: 700; letter-spacing: -.5px; }
  .transcript { height: 55vh; overflow-y: auto; }
  .line .who { font-weight: 600; }
  .line.teacher .who { color: #c84f1c; }
  .interim { color: #888; font-style: italic; }
  .rec-dot { width:.6rem; height:.6rem; border-radius:50%; background:#dc3545; display:inline-block;
             animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.3 } }
  .qa { white-space: pre-wrap; }
</style>
</head>
<body>
<nav class="navbar bg-white border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand brand" href="/" data-go>Passaly <span class="fw-normal text-body-secondary fs-6">Classes</span></a>
    <span id="me" class="small text-body-secondary"></span>
  </div>
</nav>
<main class="container pb-5" id="view"></main>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view = $('#view');
let me = JSON.parse(localStorage.getItem('person') || 'null');
let timers = [];
// Served at / locally and at /classes on passaly.com (nginx strips the prefix).
const ROOT = location.pathname.startsWith('/classes') ? '/classes' : '';

async function api(method, path, body) {
  const r = await fetch(ROOT + path, {
    method, headers: {'Content-Type': 'application/json', 'X-Person-Key': me?.key || ''},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

function go(path) { history.pushState(null, '', ROOT + path); route(); }
window.onpopstate = route;
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-go]');
  if (a) { e.preventDefault(); go(a.getAttribute('href')); }
});

function route() {
  timers.forEach(clearInterval); timers = [];
  stopCaptions();
  $('#me').textContent = me ? `Signed in as ${me.name}` : '';
  if (!me) return askName();
  const p = location.pathname.slice(ROOT.length);
  let m;
  if ((m = p.match(/^\/join\/([\w-]+)$/))) return join(m[1]);
  if ((m = p.match(/^\/class\/(\d+)$/))) return room(+m[1]);
  home();
}

// --- who are you ----------------------------------------------------------------
function askName() {
  view.innerHTML = `
    <div class="row justify-content-center"><div class="col-md-5">
      <div class="card shadow-sm"><div class="card-body p-4">
        <h1 class="h4 mb-3">Welcome to Passaly Classes</h1>
        <p class="text-body-secondary">Live classes with a personal AI tutor afterwards.</p>
        <form id="f"><label class="form-label">Your name</label>
          <input class="form-control mb-3" name="name" maxlength="60" required autofocus>
          <button class="btn btn-primary w-100">Continue</button></form>
        <div class="text-danger small mt-2" id="err"></div>
      </div></div></div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    try {
      me = await api('POST', '/api/people', {name: e.target.name.value});
      localStorage.setItem('person', JSON.stringify(me));
      route();
    } catch (x) { $('#err').textContent = x.message; }
  };
}

// --- home: my classes, new class, teacher inbox ---------------------------------
async function home() {
  view.innerHTML = `
    <div class="row g-4">
      <div class="col-lg-7">
        <h2 class="h5">My classes</h2><div id="list" class="list-group mb-4"></div>
        <h2 class="h5">Questions waiting for you</h2>
        <p class="small text-body-secondary">What the tutor could not answer from your classes.
          Your answer goes to the student and into that class's tutor.</p>
        <div id="inbox"></div>
      </div>
      <div class="col-lg-5"><div class="card shadow-sm"><div class="card-body">
        <h2 class="h5">Start a class</h2>
        <form id="f">
          <input class="form-control mb-2" name="title" placeholder="Title, e.g. Parkway vs driveway" required maxlength="200">
          <input class="form-control mb-2" name="subject" placeholder="Subject, e.g. English" maxlength="100">
          <label class="form-label small mb-1">Spoken language (for live captions)</label>
          <select class="form-select mb-2" name="lang">
            <option value="en-US">English (US)</option><option value="en-CA">English (Canada)</option>
            <option value="pt-BR">Português (Brasil)</option><option value="es-ES">Español</option>
            <option value="fr-CA">Français (Canada)</option></select>
          <input class="form-control mb-3" name="call_url" placeholder="Video call link (Meet, Zoom), optional">
          <button class="btn btn-primary w-100">Create class</button>
        </form><div class="text-danger small mt-2" id="err"></div>
      </div></div></div>
    </div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    try { const c = await api('POST', '/api/classes', f); go(`/class/${c.id}`); }
    catch (x) { $('#err').textContent = x.message; }
  };
  const classes = await api('GET', '/api/classes');
  $('#list').innerHTML = classes.length ? classes.map(c => `
    <a href="/class/${c.id}" data-go class="list-group-item list-group-item-action d-flex justify-content-between">
      <span><strong>${esc(c.title)}</strong> <span class="text-body-secondary small">· ${esc(c.subject || '')} · ${c.role === 'teacher' ? 'you teach' : 'with ' + esc(c.teacher)}</span></span>
      <span class="badge ${c.status === 'live' ? 'text-bg-danger' : 'text-bg-secondary'} align-self-center">${c.status}</span>
    </a>`).join('') : '<div class="text-body-secondary small">No classes yet.</div>';
  renderInbox();
}

async function renderInbox() {
  const qs = await api('GET', '/api/classes/inbox/waiting');
  $('#inbox').innerHTML = qs.length ? qs.map(q => answerCard(q, `<div class="small text-body-secondary">${esc(q.class_title)}</div>`)).join('')
    : '<div class="text-body-secondary small">Nothing waiting.</div>';
  bindAnswers($('#inbox'), renderInbox);
}

function answerCard(q, extra = '') {
  return `<div class="card mb-2"><div class="card-body">${extra}
    <div class="qa"><strong>${esc(q.student)}:</strong> ${esc(q.question)}</div>
    <form data-answer="${q.id}" class="mt-2">
      <textarea class="form-control mb-2" name="text" rows="2" required placeholder="Your answer"></textarea>
      <button class="btn btn-sm btn-primary">Send answer</button></form></div></div>`;
}

function bindAnswers(root, after) {
  root.querySelectorAll('form[data-answer]').forEach(f => f.onsubmit = async e => {
    e.preventDefault();
    await api('POST', `/api/classes/questions/${f.dataset.answer}/answer`, {text: f.text.value});
    after();
  });
}

// --- join -----------------------------------------------------------------------
async function join(token) {
  try { const c = await api('POST', `/api/classes/join/${token}`); history.replaceState(null, '', `${ROOT}/class/${c.id}`); route(); }
  catch (x) { view.innerHTML = `<div class="alert alert-warning">${esc(x.message)}</div>`; }
}

// --- the class room -------------------------------------------------------------
let rec = null, wantCaptions = false, lastLine = 0;

async function room(id) {
  let c;
  try { c = await api('GET', `/api/classes/${id}`); }
  catch (x) { view.innerHTML = `<div class="alert alert-warning">${esc(x.message)}</div>`; return; }
  const teacher = c.role === 'teacher', live = c.status === 'live';
  const invite = `${location.origin}${ROOT}/join/${c.invite_token}`;
  lastLine = 0;
  view.innerHTML = `
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
      <a href="/" data-go class="btn btn-sm btn-light">←</a>
      <h1 class="h4 mb-0 me-auto">${esc(c.title)} <span class="badge ${live ? 'text-bg-danger' : 'text-bg-secondary'} fs-6 align-middle">${c.status}</span></h1>
      ${c.call_url ? `<a class="btn btn-sm btn-outline-primary" target="_blank" rel="noopener" href="${esc(c.call_url)}">Open video call</a>` : ''}
      ${teacher && live ? `<button class="btn btn-sm btn-outline-danger" id="end">End class</button>` : ''}
    </div>
    <p class="small text-body-secondary">Teacher: ${esc(c.teacher)} · In class: ${c.members.map(m => esc(m.name)).join(', ')}</p>
    ${teacher ? `<div class="input-group input-group-sm mb-3"><span class="input-group-text">Invite link</span>
      <input class="form-control" readonly value="${esc(invite)}"><button class="btn btn-outline-secondary" id="copy">Copy</button></div>` : ''}
    <div class="row g-4">
      <div class="col-lg-7"><div class="card shadow-sm"><div class="card-body">
        <div class="d-flex align-items-center mb-2">
          <h2 class="h6 mb-0 me-auto">Live transcript</h2>
          ${live ? `<button class="btn btn-sm btn-primary" id="mic">Start my captions</button>` : ''}
        </div>
        <div id="micNote" class="small text-body-secondary mb-2"></div>
        <div class="transcript border rounded p-2 bg-white" id="lines"></div>
        <div class="interim small mt-1" id="interim"></div>
        ${live ? `<form id="typed" class="input-group input-group-sm mt-2">
          <input class="form-control" name="text" maxlength="1000" placeholder="Or type a line">
          <button class="btn btn-outline-secondary">Add</button></form>` : ''}
      </div></div></div>
      <div class="col-lg-5 ${live ? '' : 'order-first order-lg-0'}"><div class="card shadow-sm"><div class="card-body">
        <h2 class="h6">${teacher ? 'Student questions' : `Your tutor, taught by ${esc(c.teacher)}`}</h2>
        ${teacher ? '' : `<p class="small text-body-secondary">${live ? 'Ask during or after class.' : 'Ask anything about this class.'}
          If the class did not cover it, ${esc(c.teacher)} gets your question.</p>
          <form id="ask"><textarea class="form-control mb-2" name="question" rows="2" maxlength="1000" required
            placeholder="Your question"></textarea><button class="btn btn-primary btn-sm">Ask</button>
            <span id="thinking" class="small text-body-secondary ms-2"></span></form><hr>`}
        <div id="qs"></div>
      </div></div></div>
    </div>`;

  if (teacher) $('#copy').onclick = () => navigator.clipboard.writeText(invite);
  if (teacher && live) $('#end').onclick = async () => {
    if (!confirm('End the class? The transcript closes and the tutor learns from it.')) return;
    await api('POST', `/api/classes/${id}/end`); route();
  };
  if (live) {
    $('#mic').onclick = () => wantCaptions ? stopCaptions() : startCaptions(id, c.lang);
    $('#typed').onsubmit = async e => {
      e.preventDefault(); const t = e.target.text.value.trim(); if (!t) return;
      e.target.text.value = ''; await api('POST', `/api/classes/${id}/lines`, {text: t}); pullLines(id);
    };
  }
  if (!teacher) $('#ask').onsubmit = async e => {
    e.preventDefault(); const btn = e.target.querySelector('button');
    btn.disabled = true; $('#thinking').textContent = 'Thinking…';
    try { await api('POST', `/api/classes/${id}/ask`, {question: e.target.question.value}); e.target.reset(); }
    catch (x) { alert(x.message); }
    btn.disabled = false; $('#thinking').textContent = ''; renderQuestions(id, teacher);
  };

  await pullLines(id); renderQuestions(id, teacher);
  timers.push(setInterval(() => pullLines(id), 2000));
  timers.push(setInterval(() => renderQuestions(id, teacher), 10000));
}

async function pullLines(id) {
  const box = $('#lines'); if (!box) return;
  const r = await api('GET', `/api/classes/${id}/lines?after=${lastLine}`);
  const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  for (const l of r.lines) {
    lastLine = l.id;
    box.insertAdjacentHTML('beforeend', `<div class="line ${l.role}"><span class="who">${esc(l.name)}:</span> ${esc(l.text)}</div>`);
  }
  if (!box.children.length) box.innerHTML = '<div class="text-body-secondary small" id="empty">No lines yet.</div>';
  else $('#empty')?.remove();
  if (atEnd) box.scrollTop = box.scrollHeight;
}

async function renderQuestions(id, teacher) {
  const box = $('#qs'); if (!box) return;
  if (box.contains(document.activeElement) && document.activeElement.tagName === 'TEXTAREA') return;
  const qs = await api('GET', `/api/classes/${id}/questions`);
  const label = {answered: ['From the class', 'success'], waiting_teacher: ['Waiting for the teacher', 'warning'],
                 teacher_answered: ['The teacher answered', 'primary']};
  box.innerHTML = qs.length ? qs.map(q => teacher && q.status === 'waiting_teacher' ? answerCard(q) : `
    <div class="card mb-2"><div class="card-body small">
      <div class="d-flex mb-1"><strong class="me-auto">${teacher ? esc(q.student) + ': ' : ''}${esc(q.question)}</strong>
        <span class="badge text-bg-${label[q.status][1]} ms-2 align-self-start">${label[q.status][0]}</span></div>
      <div class="qa text-body-secondary">${esc(q.ai_answer)}</div>
      ${q.teacher_answer ? `<div class="qa mt-2 border-start border-3 border-primary ps-2"><strong>Teacher:</strong> ${esc(q.teacher_answer)}</div>` : ''}
    </div></div>`).join('') : `<div class="small text-body-secondary">No questions yet.</div>`;
  bindAnswers(box, () => renderQuestions(id, teacher));
}

// --- captions: each browser transcribes only its own speaker ---------------------
function startCaptions(id, lang) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $('#micNote').textContent = 'This browser has no live captions. Use Chrome or Edge, or type lines below.'; return; }
  rec = new SR(); rec.lang = lang; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript.trim();
      if (e.results[i].isFinal) { if (t) api('POST', `/api/classes/${id}/lines`, {text: t}).then(() => pullLines(id)); }
      else interim += t + ' ';
    }
    $('#interim').textContent = interim;
  };
  // Chrome stops after a silence; keep listening until the user turns it off.
  rec.onend = () => { if (wantCaptions) try { rec.start(); } catch {} };
  rec.onerror = e => { if (e.error === 'not-allowed') { stopCaptions(); $('#micNote').textContent = 'Microphone permission denied.'; } };
  wantCaptions = true; rec.start();
  $('#mic').textContent = 'Stop my captions';
  $('#micNote').innerHTML = '<span class="rec-dot"></span> Listening. Your browser\'s speech service turns your voice into text; only the text is saved here.';
}

function stopCaptions() {
  wantCaptions = false; rec?.stop(); rec = null;
  if ($('#mic')) $('#mic').textContent = 'Start my captions';
  if ($('#micNote')) $('#micNote').textContent = '';
  if ($('#interim')) $('#interim').textContent = '';
}

route();
</script>
</body>
</html>
