<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" width="1200" height="910" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Passaly Classes architecture</title>
  <desc id="d">The web page, the Android app and AI apps reach the class server through passaly.com/classes. The class server keeps classes, files, tasks and tokens, asks Meta's Muse Spark in the cloud, and shares one memory in a private ai-memory container. The phone runs Llama 3.2 itself. Google provides the sign-in and, for meetings created with a Meet link, Meet's transcript.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6472"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1d6fd8"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c84f1c"/>
    </marker>
    <style>
      .h { font-size: 17px; font-weight: 700; fill: #1f2733; }
      .s { font-size: 13px; fill: #4a5361; }
      .x { font-size: 12.5px; fill: #2c3440; }
      .tag { font-size: 11.5px; font-weight: 600; }
      .lbl { font-size: 12px; fill: #3b4350; }
      .card { fill: #ffffff; stroke: #d6dbe3; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1200" height="910" fill="#f7f8fa"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1f2733">Passaly Classes · architecture</text>
  <text x="40" y="68" class="s">Two brains (Muse in Meta's cloud, Llama on the phone), one shared memory, one MCP server for any AI app.</text>

  <!-- ===== clients ===== -->
  <g transform="translate(40,96)">
    <rect class="card" width="340" height="168" rx="14"/>
    <rect width="340" height="6" rx="3" fill="#1d6fd8"/>
    <text x="20" y="36" class="h">🖥  Web page</text>
    <text x="20" y="56" class="s">Chrome or Edge, any computer</text>
    <text x="20" y="86" class="x">• Live captions (Web Speech API)</text>
    <text x="20" y="108" class="x">• Classes, meetings, recaps, files</text>
    <text x="20" y="130" class="x">• Tutor and the teacher's inbox</text>
    <text x="20" y="152" class="x">• "Connect an AI app": MCP tokens</text>
  </g>

  <g transform="translate(430,96)">
    <rect class="card" width="340" height="168" rx="14"/>
    <rect width="340" height="6" rx="3" fill="#EC662E"/>
    <text x="20" y="36" class="h">📱  Android app (Flutter)</text>
    <text x="20" y="56" class="s">Works with or without the cloud</text>
    <text x="20" y="86" class="x">• Captions (Android SpeechRecognizer)</text>
    <text x="20" y="108" class="x">• Llama 3.2 1B / 3B on the phone (LiteRT-LM)</text>
    <text x="20" y="130" class="x">• Assistant → calendar · share · note · task</text>
    <text x="20" y="152" class="x">• Tasks in each room · calendar needs a tap</text>
  </g>

  <g transform="translate(820,96)">
    <rect class="card" width="340" height="168" rx="14"/>
    <rect width="340" height="6" rx="3" fill="#7a4fd6"/>
    <text x="20" y="36" class="h">🤖  AI apps &amp; cloud agents</text>
    <text x="20" y="56" class="s">Claude, LM Studio, Muse Code…</text>
    <text x="20" y="86" class="x">• Connect over MCP (Streamable HTTP)</text>
    <text x="20" y="108" class="x">• list · read · search your files</text>
    <text x="20" y="130" class="x">• do tasks · add notes, docs (if allowed)</text>
    <text x="20" y="152" class="x">• Bearer pcm_… token, never the login</text>
  </g>

  <!-- arrows clients -> nginx -->
  <line x1="210" y1="264" x2="210" y2="318" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="264" x2="600" y2="318" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>
  <line x1="990" y1="264" x2="990" y2="318" stroke="#7a4fd6" stroke-width="2" marker-end="url(#a)"/>
  <text x="222" y="296" class="lbl">HTTPS · login key</text>
  <text x="612" y="296" class="lbl">HTTPS · login key · Llama download</text>
  <text x="1002" y="296" class="lbl">HTTPS · /classes/mcp</text>

  <!-- ===== VPS ===== -->
  <rect x="24" y="322" width="1152" height="388" rx="18" fill="#eef1f6" stroke="#b9c2cf" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="350" font-size="14" font-weight="700" fill="#5b6472">VPS · Docker</text>

  <!-- nginx -->
  <g transform="translate(160,336)">
    <rect width="880" height="44" rx="10" fill="#1f2733"/>
    <text x="440" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">nginx · passaly.com/classes · TLS · rate limit · microphone allowed only here</text>
  </g>
  <line x1="600" y1="380" x2="600" y2="410" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>

  <!-- class server -->
  <g transform="translate(48,414)">
    <rect class="card" width="640" height="272" rx="14" stroke="#EC662E" stroke-width="1.8"/>
    <text x="20" y="34" class="h">Class server · container "classes"</text>
    <text x="20" y="54" class="s">Python · FastAPI · SQLAlchemy</text>

    <g transform="translate(20,72)">
      <rect width="190" height="56" rx="9" fill="#fff4ee" stroke="#f3c6ad"/>
      <text x="12" y="23" class="x" font-weight="600">Classes &amp; meetings</text>
      <text x="12" y="42" class="s">invites · live transcript</text>
    </g>
    <g transform="translate(222,72)">
      <rect width="190" height="56" rx="9" fill="#fff4ee" stroke="#f3c6ad"/>
      <text x="12" y="23" class="x" font-weight="600">Tutor &amp; inbox</text>
      <text x="12" y="42" class="s">not covered → teacher</text>
    </g>
    <g transform="translate(424,72)">
      <rect width="196" height="56" rx="9" fill="#fff4ee" stroke="#f3c6ad"/>
      <text x="12" y="23" class="x" font-weight="600">Recaps &amp; profiles</text>
      <text x="12" y="42" class="s">after a session ends</text>
    </g>
    <g transform="translate(20,138)">
      <rect width="190" height="56" rx="9" fill="#fff4ee" stroke="#f3c6ad"/>
      <text x="12" y="23" class="x" font-weight="600">Assistant</text>
      <text x="12" y="42" class="s">Muse tools → actions</text>
    </g>
    <g transform="translate(222,138)">
      <rect width="190" height="56" rx="9" fill="#fff4ee" stroke="#f3c6ad"/>
      <text x="12" y="23" class="x" font-weight="600">Files · Tasks</text>
      <text x="12" y="42" class="s">uploads → text · task list</text>
    </g>
    <g transform="translate(424,138)">
      <rect width="196" height="56" rx="9" fill="#f3eefd" stroke="#cdbdf3"/>
      <text x="12" y="23" class="x" font-weight="600">MCP server + tokens</text>
      <text x="12" y="42" class="s">hashed · read-only · revocable</text>
    </g>

    <g transform="translate(20,206)">
      <rect width="600" height="48" rx="9" fill="#f2f4f7" stroke="#d6dbe3"/>
      <text x="14" y="21" class="x" font-weight="600">🗄  /data volume</text>
      <text x="14" y="39" class="s">SQLite: people · sessions · lines · questions · files · tasks · token hashes + uploads</text>
    </g>
  </g>

  <!-- ai-memory -->
  <g transform="translate(756,414)">
    <rect class="card" width="396" height="196" rx="14" stroke="#2e9c6a" stroke-width="1.8"/>
    <text x="20" y="34" class="h">🧠  ai-memory · private</text>
    <text x="20" y="54" class="s">akitaonrails/ai-memory 3.2.10 · no public port</text>
    <text x="20" y="84" class="x">One space per class/meeting and per person:</text>
    <text x="20" y="106" class="x">• transcript.md · recap.md · answers/</text>
    <text x="20" y="128" class="x">• files/ (the text of each upload)</text>
    <text x="20" y="150" class="x">• tasks/ (one page per task) · notes/ · profiles</text>
    <text x="20" y="176" class="s">Searches only look in the asker's own spaces</text>
  </g>
  <line x1="688" y1="520" x2="750" y2="520" stroke="#2e9c6a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="719" y="508" text-anchor="middle" class="tag" fill="#2e9c6a">MCP</text>
  <text x="719" y="540" text-anchor="middle" class="tag" fill="#2e9c6a">token</text>

  <!-- Llama files -->
  <g transform="translate(756,626)">
    <rect class="card" width="396" height="60" rx="12"/>
    <text x="20" y="26" class="x" font-weight="600">📦  /classes/models/ (served by nginx)</text>
    <text x="20" y="46" class="s">Llama 3.2 files · SHA-256 checked by the phone · license</text>
  </g>

  <!-- ===== outside ===== -->
  <g transform="translate(40,736)">
    <rect width="560" height="64" rx="14" fill="#e8f1fd" stroke="#9cc2f2"/>
    <text x="20" y="27" class="h" fill="#1d4f9a">☁  Meta Model API · Muse Spark 1.3</text>
    <text x="20" y="48" class="s">recaps · profiles · tutor · assistant (tool calling) · api.meta.ai/v1</text>
  </g>
  <line x1="300" y1="686" x2="300" y2="730" stroke="#1d6fd8" stroke-width="2" marker-end="url(#ab)"/>

  <g transform="translate(640,736)">
    <rect width="520" height="64" rx="14" fill="#fff4ee" stroke="#f3c6ad"/>
    <text x="20" y="27" class="h" fill="#9a3a12">🤗  Hugging Face · Meta Llama 3.2 (gated)</text>
    <text x="20" y="48" class="s">downloaded once to the server with the owner's token</text>
  </g>
  <line x1="954" y1="730" x2="954" y2="690" stroke="#c84f1c" stroke-width="2" marker-end="url(#ao)"/>

  <g transform="translate(40,826)">
    <rect width="1120" height="64" rx="14" fill="#eef7ee" stroke="#a9d3ad"/>
    <text x="20" y="27" class="h" fill="#1e6b2f">🔑  Google · Sign in with Google · Meet REST API</text>
    <text x="20" y="48" class="s">who you are (openid) · creates the Meet link with the transcript on · reads Meet's transcript after the call</text>
  </g>
  <line x1="620" y1="686" x2="620" y2="820" stroke="#2e8b3e" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
</svg>
